name = "market-map-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Promotes the live snapshot into the delayed slot, which is what makes the
# free tier genuinely 15 minutes behind.
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "MAP_CACHE"
id = "replace-with-your-kv-namespace-id"

# Secrets are set with `wrangler secret put`, never in this file:
#   wrangler secret put FMP_API_KEY
#   wrangler secret put REVENUECAT_SECRET_KEY
